name: engine-fast-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.12"
      - name: Line limits and non-browser tests
        run: ./tools/ci.sh --fast
